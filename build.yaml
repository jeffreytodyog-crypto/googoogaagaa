name: Build Geode Mod

on:
  push:
    branches: [ "main" ] # Triggers on every push to the main branch
  workflow_dispatch:      # Allows you to manually trigger the build

jobs:
  build:
    runs-on: windows-latest # Uses a Windows build machine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          # The action defaults to the latest SDK and CLI, which is fine.
          # For a Windows-only mod, no extra 'target' is needed.
          sdk: 'latest'
          cli: 'latest'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-mod-windows
          path: ${{ steps.build.outputs.build-output }}
